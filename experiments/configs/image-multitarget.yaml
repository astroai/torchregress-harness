datasets:
  - name: biwi
    type: image
    n_cap: 1000
    target_dim: 3
    rho: 0.6
  - name: imdb_wiki
    type: image
    n_cap: 5000
    target_dim: 1
    rho: 0.6
methods:
  - loss: gaussian_nll
    loss_kwargs: {}
  - loss: sls
    loss_kwargs: {d: 3, context_dim: 64, K: 1, hidden_dim: 64, n_transforms: 4}
  - loss: nflow
    loss_kwargs: {n_features: 3, context_dim: 64, flow_type: nsf, n_transforms: 5, hidden_features: [64, 64]}
seeds: [42]
epochs: 30
batch_size: 32
device: auto
