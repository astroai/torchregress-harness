[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchregress-harness"
version = "0.1.0"
description = "Benchmarking harness for torchregress against external regression libraries on known tabular and image datasets."
readme = "README.md"
authors = [
    {name = "Sébastien Fabbro", email = "sebfabbro@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12, <3.16"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["pytorch", "regression", "benchmark", "harness", "comparison", "deep learning"]
dependencies = [
    "torchregress[flows]",
    "torch",
    "numpy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "scipy",
    "tqdm",
]

[project.urls]
"Homepage" = "https://github.com/sfabbro/torchregress-harness"
"Bug Tracker" = "https://github.com/sfabbro/torchregress-harness/issues"

[project.optional-dependencies]
# External-library comparison pins: the harness must be benchmarked against
# the LATEST GIT versions of mapie / torch-uncertainty for paper-grade
# comparisons.  Exact commit SHAs + install commands: see EXTERNAL_PINS.md.
# The floors below only guard against known-API breaks (v1 mapie API,
# torch-uncertainty >= 0.13 regression-routine rework).
conformal = [
    "mapie>=1.4.1",
    "crepes",
    "torchcp",
]
bayesian = [
    "botorch",
    "gpytorch",
]
tweedie = [
    "scikit-lego",
]
foundation = [
    "tabpfn",
    "tabicl",
]
boosting = [
    "lightgbm",
    "xgboost",
]
image = [
    "torchvision",
    "torch-uncertainty>=0.13.0",
    "lightning",
    "lightning-uq-box>=0.3.0",
    "timm",
    "requests",
    "Pillow",
    "h5py",
]
test = [
    "pytest",
    "pytest-cov",
    "PyYAML",
]
dev = [
    "ruff",
    "ty",
]
all = [
    "torchregress-harness[conformal,bayesian,tweedie,foundation,boosting,image,test,dev]",
]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    ".pixi",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"suites/*" = ["E501", "F401", "E402", "E741", "F841"]
"tools/*" = ["E501", "E402", "E741", "F841"]
"tools/run_all.py" = ["E402"]
"tools/run_canonical.py" = ["E402"]
"tests/*" = ["E501", "E402", "W293"]
"src/harness/*" = ["E501"]

[tool.ty.environment]
python = ".pixi/envs/default"
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = false

[tool.ty.rules]
invalid-argument-type = "warn"
invalid-return-type = "warn"
missing-argument = "warn"
invalid-assignment = "warn"
unresolved-attribute = "warn"
unresolved-import = "warn"
invalid-method-override = "warn"
call-top-callable = "warn"
call-non-callable = "warn"
not-iterable = "warn"
not-subscriptable = "warn"
redundant-cast = "ignore"
unused-type-ignore-comment = "ignore"

[tool.coverage.run]
branch = false
source = ["harness"]
omit = [
    "**/__init__.py",
    "**/conftest.py",
]
