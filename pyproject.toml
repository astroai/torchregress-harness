[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchregress-harness"
version = "0.1.0"
description = "Benchmarking harness for torchregress against external regression libraries on known tabular and image datasets."
readme = "README.md"
authors = [
    {name = "Sébastien Fabbro", email = "sebfabbro@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12, <3.16"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["pytorch", "regression", "benchmark", "harness", "comparison", "deep learning"]
dependencies = [
    "torchregress[flows]",
    "torch",
    "numpy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "scipy",
    "tqdm",
]

[project.urls]
"Homepage" = "https://github.com/sfabbro/torchregress-harness"
"Bug Tracker" = "https://github.com/sfabbro/torchregress-harness/issues"

[project.optional-dependencies]
conformal = [
    "mapie",
    "crepes",
    "torchcp",
]
bayesian = [
    "botorch",
    "gpytorch",
]
tweedie = [
    "scikit-lego",
]
foundation = [
    "tabpfn",
    "tabicl",
]
boosting = [
    "lightgbm",
    "xgboost",
]
causal = [
    "econml",
    "dowhy",
]
image = [
    "torchvision",
    "torch-uncertainty",
    "lightning",
    "timm",
    "requests",
    "Pillow",
    "h5py",
]
test = [
    "pytest",
    "pytest-cov",
    "PyYAML",
]
dev = [
    "ruff",
    "mypy",
]
all = [
    "torchregress-harness[conformal,bayesian,tweedie,foundation,boosting,causal,test,dev]",
]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.uv.sources]
torchregress = { path = "../torchregress" }

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    ".uv-cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"suites/*" = ["E501"]
"tools/*" = ["E501"]
"tools/run_all.py" = ["E402"]
"tools/run_canonical.py" = ["E402"]
"tests/*" = ["E501"]

[tool.coverage.run]
branch = false
source = ["harness"]
omit = [
    "**/__init__.py",
    "**/conftest.py",
]
