[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchregress-harness"
version = "0.1.0"
description = "Benchmarking harness for torchregress against external regression libraries on known tabular and image datasets."
readme = "README.md"
authors = [
    {name = "Sébastien Fabbro", email = "sebfabbro@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12, <3.16"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["pytorch", "regression", "benchmark", "harness", "comparison", "deep learning"]
dependencies = [
    "torchregress[flows]>=0.1.0",
    "torch>=2.4.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
]

[project.urls]
"Homepage" = "https://github.com/sfabbro/torchregress-harness"
"Bug Tracker" = "https://github.com/sfabbro/torchregress-harness/issues"

[project.optional-dependencies]
conformal = [
    "mapie>=0.8.0",
    "crepes>=0.7.0",
    "torchcp>=0.3.0",
]
bayesian = [
    "botorch>=0.10.0",
    "gpytorch>=1.11.0",
]
tweedie = [
    "scikit-lego>=0.7.0",
]
foundation = [
    "tabpfn>=1.0.0",
    "tabicl",
]
boosting = [
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
]
causal = [
    "econml>=0.15.0",
    "dowhy>=0.11.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "PyYAML>=6.0.0",
]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
all = [
    "torchregress-harness[conformal,bayesian,tweedie,foundation,boosting,causal,test,dev]",
]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.uv.sources]
torchregress = { path = "../torchregress" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    ".uv-cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"suites/*" = ["E501"]
"tools/*" = ["E501"]
"tools/run_all.py" = ["E402"]
"tools/run_canonical.py" = ["E402"]
"tests/*" = ["E501"]

[tool.coverage.run]
branch = false
source = ["harness"]
omit = [
    "**/__init__.py",
    "**/conftest.py",
]
