[workspace]
name = "torchregress-harness"
version = "0.1.0"
description = "Benchmarking harness for torchregress against external regression libraries on known tabular and image datasets."
authors = ["Sébastien Fabbro <sebfabbro@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
pytorch = ">=2.0"
numpy = ">=1.24"
scipy = ">=1.10"
scikit-learn = "*"
pandas = "*"
matplotlib = "*"
tqdm = "*"
zuko = "*"
torchmetrics = "*"

[feature.dev.dependencies]
ruff = ">=0.6"
ty = ">=0.0.5"

[feature.test.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
pyyaml = "*"

[pypi-dependencies]
torchregress = { path = "../torchregress", editable = true }
torchregress-harness = { path = ".", editable = true }

[environments]
default = { features = ["dev", "test"], solve-group = "default" }

[tasks]
lint = { cmd = "ruff check src/harness tests tools suites && ruff format --check src/harness tests tools suites" }
format = "ruff format src/harness tests tools suites"
typecheck = "ty check --python .pixi/envs/default src/harness"
test = "pytest --cov=harness --cov-report=term"
ci = { depends-on = ["lint", "typecheck", "test"] }
experiments-smoke = "python -m suites.experiments.sweep --config experiments/configs/smoke.yaml --output results/experiments/smoke"
experiments-tabular = "python -m suites.experiments.sweep --config experiments/configs/tabular-large.yaml --output results/experiments/tabular-large"
experiments-image = "python -m suites.experiments.sweep --config experiments/configs/image-multitarget.yaml --output results/experiments/image-multitarget"
experiments-ablations = "python -m suites.experiments.sweep --config experiments/configs/ablations.yaml --output results/experiments/ablations"
experiments-all = { depends-on = ["experiments-smoke", "experiments-tabular", "experiments-image", "experiments-ablations"] }
