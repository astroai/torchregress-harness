name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout torchregress
        uses: actions/checkout@v4
        with:
          repository: sfabbro/torchregress
          path: torchregress

      - name: Link torchregress for uv path source
        run: ln -sfn "$PWD/torchregress" ../torchregress


      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[test,dev]"

      - name: ruff check
        run: uv run ruff check src/harness tests tools

      - name: ruff format check
        run: uv run ruff format --check src/harness tests tools

      - name: Run tests with coverage
        run: uv run pytest --cov=harness --cov-report=term tests/

      - name: Harness smoke (all suites, tiny data)
        run: uv run python tools/run_all.py --smoke --output results/latest/harness_smoke.json

      - name: Render smoke report
        run: uv run python tools/render_report.py results/latest/harness_smoke.json --output results/latest/harness_smoke.md

  canonical-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - mapie_reference
          - crepes_reference
          - sklearn_tweedie_reference
          - sklearn_synthetic_reference
          - sklearn_diabetes_reference
          - botorch_reference
    steps:
      - uses: actions/checkout@v4

      - name: Checkout torchregress
        uses: actions/checkout@v4
        with:
          repository: sfabbro/torchregress
          path: torchregress

      - name: Link torchregress for uv path source
        run: ln -sfn "$PWD/torchregress" ../torchregress


      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          uv pip install --system -e ".[test,conformal,bayesian,tweedie]"

      - name: Run canonical scenario (smoke)
        run: |
          echo "=== Canonical scenario: ${{ matrix.scenario }} ==="
          uv run python tools/run_canonical.py \
            --scenario ${{ matrix.scenario }} \
            --smoke \
            --output results/latest/canonical_${{ matrix.scenario }}.json \
            --report results/latest/canonical_${{ matrix.scenario }}.md

          ARTIFACT="results/latest/canonical_${{ matrix.scenario }}.json"
          if [ ! -f "${ARTIFACT}" ]; then
            echo "ERROR: JSON artifact was not written — run_canonical.py may have failed before writing"
            exit 1
          fi

          ROWS=$(uv run python -c "
          import json
          data = json.load(open('${ARTIFACT}'))
          print(data.get('aggregate', {}).get('n_total', 0))
          ")
          echo "Rows produced: ${ROWS}"
          if [ "${ROWS}" -eq 0 ]; then
            echo "ERROR: scenario ${{ matrix.scenario }} produced zero rows"
            exit 1
          fi
          echo "Scenario ${{ matrix.scenario }} OK — ${ROWS} rows"

      - name: Upload canonical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-${{ matrix.scenario }}
          path: results/latest/canonical_${{ matrix.scenario }}.json
          if-no-files-found: warn

  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Checkout torchregress
        uses: actions/checkout@v4
        with:
          repository: sfabbro/torchregress
          path: torchregress

      - name: Link torchregress for uv path source
        run: ln -sfn "$PWD/torchregress" ../torchregress


      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all deps
        run: |
          uv pip install --system -e ".[all]"

      - name: Run full harness
        run: uv run python tools/run_all.py --output results/latest/harness_full.json

      - name: Render full report
        run: uv run python tools/render_report.py results/latest/harness_full.json --output results/latest/harness_full.md

      - name: Upload heavy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-full
          path: |
            results/latest/harness_full.json
            results/latest/harness_full.md
          if-no-files-found: warn

  heavy-tabred:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        dataset:
          - tabred_sberbank
          - tabred_cooking
          - tabred_delivery
          - tabred_maps
          - tabred_weather
    steps:
      - uses: actions/checkout@v4

      - name: Checkout torchregress
        uses: actions/checkout@v4
        with:
          repository: sfabbro/torchregress
          path: torchregress

      - name: Link torchregress for uv path source
        run: ln -sfn "$PWD/torchregress" ../torchregress


      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          uv pip install --system -e ".[all]"

      - name: Run sklearn_baselines on TabReD dataset
        run: |
          uv run python tools/run_all.py \
            --suites sklearn_baselines \
            --datasets ${{ matrix.dataset }} \
            --epochs 30 \
            --output results/latest/harness_tabred_${{ matrix.dataset }}.json

      - name: Render TabReD report
        run: |
          uv run python tools/render_report.py \
            results/latest/harness_tabred_${{ matrix.dataset }}.json \
            --output results/latest/harness_tabred_${{ matrix.dataset }}.md

      - name: Upload TabReD artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-tabred-${{ matrix.dataset }}
          path: |
            results/latest/harness_tabred_${{ matrix.dataset }}.json
            results/latest/harness_tabred_${{ matrix.dataset }}.md
          if-no-files-found: warn

  heavy-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - mapie_reference
          - crepes_reference
          - sklearn_tweedie_reference
          - sklearn_synthetic_reference
          - sklearn_diabetes_reference
          - botorch_reference
    steps:
      - uses: actions/checkout@v4

      - name: Checkout torchregress
        uses: actions/checkout@v4
        with:
          repository: sfabbro/torchregress
          path: torchregress

      - name: Link torchregress for uv path source
        run: ln -sfn "$PWD/torchregress" ../torchregress


      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          uv pip install --system -e ".[test,conformal,bayesian,tweedie]"

      - name: Run canonical scenario (full)
        run: |
          echo "=== Heavy canonical scenario: ${{ matrix.scenario }} ==="
          uv run python tools/run_canonical.py \
            --scenario ${{ matrix.scenario }} \
            --epochs 60 \
            --output results/latest/heavy_canonical_${{ matrix.scenario }}.json \
            --report results/latest/heavy_canonical_${{ matrix.scenario }}.md

          ARTIFACT="results/latest/heavy_canonical_${{ matrix.scenario }}.json"
          if [ ! -f "${ARTIFACT}" ]; then
            echo "ERROR: JSON artifact was not written"
            exit 1
          fi

          ROWS=$(uv run python -c "
          import json
          data = json.load(open('${ARTIFACT}'))
          print(data.get('aggregate', {}).get('n_total', 0))
          ")
          echo "Rows produced: ${ROWS}"
          if [ "${ROWS}" -eq 0 ]; then
            echo "ERROR: scenario ${{ matrix.scenario }} produced zero rows"
            exit 1
          fi
          echo "Heavy scenario ${{ matrix.scenario }} OK — ${ROWS} rows"

      - name: Upload heavy canonical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-canonical-${{ matrix.scenario }}
          path: |
            results/latest/heavy_canonical_${{ matrix.scenario }}.json
            results/latest/heavy_canonical_${{ matrix.scenario }}.md
          if-no-files-found: warn

  compare-canonical:
    # NOTE: needs with matrices is all-or-nothing — if any scenario fails in
    # either upstream job, ALL comparisons are skipped. This is a GitHub
    # Actions limitation; there is no per-matrix-instance dependency.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [canonical-scenarios, heavy-canonical]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - mapie_reference
          - crepes_reference
          - sklearn_tweedie_reference
          - sklearn_synthetic_reference
          - sklearn_diabetes_reference
          - botorch_reference
    steps:
      - uses: actions/checkout@v4

      - name: Checkout torchregress
        uses: actions/checkout@v4
        with:
          repository: sfabbro/torchregress
          path: torchregress

      - name: Link torchregress for uv path source
        run: ln -sfn "$PWD/torchregress" ../torchregress


      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          uv pip install --system -e ".[test]"

      - name: Download smoke (baseline) artifact
        uses: actions/download-artifact@v4
        with:
          name: canonical-${{ matrix.scenario }}
          path: artifacts/smoke

      - name: Download heavy (current) artifact
        uses: actions/download-artifact@v4
        with:
          name: heavy-canonical-${{ matrix.scenario }}
          path: artifacts/heavy

      - name: Compare canonical runs
        run: |
          echo "=== Comparing ${{ matrix.scenario }}: smoke (baseline) vs heavy (current) ==="
          uv run python tools/compare_runs.py \
            artifacts/smoke/canonical_${{ matrix.scenario }}.json \
            artifacts/heavy/heavy_canonical_${{ matrix.scenario }}.json \
            --metric RMSE \
            --diff-threshold 0.25 \
            --fail-on-regression

  heavy-summary:
    # NOTE: needs with matrices is all-or-nothing — if any scenario/dataset
    # fails in either upstream matrix job, ALL aggregation is skipped. This is
    # a GitHub Actions limitation; there is no per-matrix-instance dependency.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [heavy, heavy-tabred, heavy-canonical]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Checkout torchregress
        uses: actions/checkout@v4
        with:
          repository: sfabbro/torchregress
          path: torchregress

      - name: Link torchregress for uv path source
        run: ln -sfn "$PWD/torchregress" ../torchregress


      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          uv pip install --system -e ".[test]"

      - name: Download all heavy artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: heavy-*
          path: artifacts/heavy

      - name: Aggregate heavy summary report
        run: |
          uv run python -c "
          import json
          from pathlib import Path
          from collections import defaultdict

          root = Path('artifacts/heavy')
          if not root.exists():
              print('No artifacts found — nothing to aggregate.')
              print()
              print('## Heavy Run Summary')
              print()
              print('_(no artifacts available)_')
              import sys; sys.exit(0)

          # Collect all JSON artifacts
          json_files = sorted(root.rglob('*.json'))

          lines = []
          lines.append('# Heavy Run Summary')
          lines.append('')
          lines.append('| Run | Suites | Datasets/Scenarios | Total | OK | Skipped | Errors |')
          lines.append('|-----|--------|---------------------|-------|----|---------|--------|')

          grand_total = 0
          grand_ok = 0
          grand_skip = 0
          grand_err = 0

          # Only process heavy-* artifacts (skip smoke canonical-*, etc.)
          for jf in json_files:
              artifact_name = jf.parent.name
              if not artifact_name.startswith('heavy'):
                  continue
              run_name = artifact_name  # artifact name = run identifier
              try:
                  data = json.loads(jf.read_text())
              except Exception:
                  lines.append(f'| {run_name} | *(parse error)* | — | — | — | — | — |')
                  continue

              suites = ', '.join(data.get('suites', [])) or '-'
              datasets = ', '.join(data.get('datasets', [])) or '-'
              agg = data.get('aggregate', {})
              n_total = agg.get('n_total', 0)
              n_ok = agg.get('n_ok', 0)
              n_skip = agg.get('n_skipped', 0)
              n_err = agg.get('n_error', 0)

              grand_total += n_total
              grand_ok += n_ok
              grand_skip += n_skip
              grand_err += n_err

              lines.append(f'| {run_name} | {suites} | {datasets} | {n_total} | {n_ok} | {n_skip} | {n_err} |')

          lines.append(f'| **TOTAL** | — | — | **{grand_total}** | **{grand_ok}** | **{grand_skip}** | **{grand_err}** |')
          lines.append('')

          # List all individual reports
          md_files = sorted(root.rglob('*.md'))
          if md_files:
              lines.append('## Individual Reports')
              lines.append('')
              for mf in md_files:
                  rel = mf.relative_to(root)
                  lines.append(f'- [{rel}](./{rel})')
              lines.append('')

          summary = '\n'.join(lines)
          out = Path('results/latest/heavy_summary.md')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(summary)
          print(summary)
          "

      - name: Upload summary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-summary
          path: results/latest/heavy_summary.md
          if-no-files-found: warn
