name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Checkout path dependency siblings
        uses: actions/checkout@v4
        with:
          repository: astroai/torchregress
          path: .torchregress
          token: ${{ secrets.PAT_FOR_PRIVATE_REPOS }}

      - name: Move siblings to parent directory
        run: mv .torchregress ../torchregress

      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.73.0

      - name: Lint
        run: pixi run lint

      - name: Type-check
        run: pixi run typecheck

      - name: Test
        run: pixi run test
